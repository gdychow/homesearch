services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homealign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homealign}
      POSTGRES_DB: ${POSTGRES_DB:-homealign}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homealign}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homealign}:${POSTGRES_PASSWORD:-homealign}@postgres:5432/${POSTGRES_DB:-homealign}
      SESSION_SECRET: ${SESSION_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"

  # One-off job for `prisma migrate deploy` / `npm run db:seed`. Built from
  # the `builder` stage (not the slim runtime `app` image) because that's
  # the stage with devDependencies installed - the prisma CLI and tsx aren't
  # in the production standalone output, so `docker compose exec app ...`
  # can't run them. Run with: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homealign}:${POSTGRES_PASSWORD:-homealign}@postgres:5432/${POSTGRES_DB:-homealign}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run db:seed"
    profiles: ["tools"]

  # Not run from this stack — cloudflared runs separately on the host.
  # Uncomment (and set CLOUDFLARE_TUNNEL_TOKEN in .env) to run it here
  # instead, pointed at http://app:3000 as the tunnel's origin service.
  #   docker compose --profile tunnel up -d
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   profiles: ["tunnel"]
  #   command: tunnel run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - app

volumes:
  postgres_data:

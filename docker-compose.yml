services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homealign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homealign}
      POSTGRES_DB: ${POSTGRES_DB:-homealign}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homealign}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homealign}:${POSTGRES_PASSWORD:-homealign}@postgres:5432/${POSTGRES_DB:-homealign}
      SESSION_SECRET: ${SESSION_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
